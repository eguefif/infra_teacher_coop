services:
  meilisearch:
    image: getmeili/meilisearch:v1.53.1
    environment:
      MEILI_ENV: development
    secrets:
      - meili_master_key
    entrypoint:
      - sh
      - -c
      - >-
        export MEILI_MASTER_KEY="$$(cat /run/secrets/meili_master_key)";
        exec /bin/meilisearch
    volumes:
      - meilisearch_data:/meili_data

  teacher_coop:
    image: eguefif/teacher_coop:20260922100008
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PHX_HOST: "www.teachercoop.org"
    secrets:
      - database_url
      - secret_key_base
      - meili_master_key
    command:
      - sh
      - -c
      - >-
        export DATABASE_URL="$$(cat /run/secrets/database_url)";
        export SECRET_KEY_BASE="$$(cat /run/secrets/secret_key_base)";
        export MEILISEARCH_MASTERKEY="$$(cat /run/secrets/meili_master_key)";
        exec /app/bin/server
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.teacher_coop.rule=Host(`www.teachercoop.org`) || Host(`teachercoop.org`)"
        - "traefik.http.routers.teacher_coop.entrypoints=websecure"
        - "traefik.http.routers.teacher_coop.middlewares=to_www"
        - "traefik.http.middlewares.to_www.redirectregex.regex=^https://teachercoop\\.org/(.*)"
        - "traefik.http.middlewares.to_www.redirectregex.replacement=https://www.teachercoop.org/$${1}"
        - "traefik.http.services.teacher_coop.loadbalancer.server.port=4000"

  migration:
    image: eguefif/teacher_coop:20260922100008
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - database_url
      - secret_key_base
      - meili_master_key
    command:
      - sh
      - -c
      - >-
        export DATABASE_URL="$$(cat /run/secrets/database_url)";
        export SECRET_KEY_BASE="$$(cat /run/secrets/secret_key_base)";
        export MEILISEARCH_MASTERKEY="$$(cat /run/secrets/meili_master_key)";
        exec /app/bin/migrate
    deploy:
      labels:
        - "traefik.enable=false"

  traefik:
    image: traefik:v3.7
    secrets:
      - admin_email
      - traefik_admin_password
    entrypoint:
      - sh
      - -c
      - >-
        ADMIN_EMAIL="$$(cat /run/secrets/admin_email)";
        PASSWORD="$$(cat /run/secrets/traefik_admin_password)";
        sed "s|__ADMIN_EMAIL__|$$ADMIN_EMAIL|" /etc/traefik/traefik.tmpl.yml > /etc/traefik/traefik.yml;
        printf '%s:%s\n' "$$ADMIN_EMAIL" "$$PASSWORD" > /etc/traefik/dashboard_users;
        exec traefik
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/traefik/acme.json:/acme.json
      - ./traefik.yml:/etc/traefik/traefik.tmpl.yml:ro
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.services.traefik.loadbalancer.server.port=9500"
        - "traefik.http.routers.dashboard.rule=Host(`traefik.teachercoop.org`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))"
        - "traefik.http.routers.dashboard.entrypoints=websecure"
        - "traefik.http.routers.dashboard.service=api@internal"
        - "traefik.http.routers.dashboard.middlewares=auth"
        - "traefik.http.middlewares.auth.basicauth.usersfile=/etc/traefik/dashboard_users"
      placement:
        constraints:
          - node.role == manager

  agent:
    image: portainer/agent:lts
    environment:
      AGENT_CLUSTER_ADDR: tasks.agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - agent_network
    deploy:
      mode: global
      placement:
        constraints: [node.platform.os == linux]

  portainer:
    image: portainer/portainer-ce:lts
    command: -H tcp://tasks.agent:9001 --tlsskipverify
    volumes:
      - portainer_data:/data
    networks:
      - default
      - agent_network
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]
      labels:
      - "traefik.enable=true"
      - "traefik.swarm.network=teachercoop_default"
      - "traefik.http.routers.portainer.rule=Host(`portainer.teachercoop.org`)"
      - "traefik.http.routers.portainer.entrypoints=websecure"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
      - "traefik.http.routers.portainer.service=portainer"

volumes:
  meilisearch_data:
  portainer_data:

networks:
  agent_network:
    external: true

secrets:
  database_url:
    external: true
  secret_key_base:
    external: true
  meili_master_key:
    external: true
  admin_email:
    external: true
  traefik_admin_password:
    external: true
