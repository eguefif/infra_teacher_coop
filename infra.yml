services:
  traefik:
    image: traefik:v3.7
    secrets:
      - admin_email
      - traefik_admin_password
    entrypoint:
      - sh
      - -c
      - >-
        ADMIN_EMAIL="$$(cat /run/secrets/admin_email)";
        PASSWORD="$$(cat /run/secrets/traefik_admin_password)";
        sed "s|__ADMIN_EMAIL__|$$ADMIN_EMAIL|" /etc/traefik/traefik.tmpl.yml > /etc/traefik/traefik.yml;
        printf '%s:%s\n' "$$ADMIN_EMAIL" "$$PASSWORD" > /etc/traefik/dashboard_users;
        exec traefik
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/traefik/acme.json:/acme.json
      - ./traefik.yml:/etc/traefik/traefik.tmpl.yml:ro
    networks:
      - traefik_public
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.services.traefik.loadbalancer.server.port=9500"
        - "traefik.http.routers.dashboard.rule=Host(`traefik.teachercoop.org`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))"
        - "traefik.http.routers.dashboard.entrypoints=websecure"
        - "traefik.http.routers.dashboard.service=api@internal"
        - "traefik.http.routers.dashboard.middlewares=auth"
        - "traefik.http.middlewares.auth.basicauth.usersfile=/etc/traefik/dashboard_users"
      placement:
        constraints:
          - node.role == manager

  agent:
    image: portainer/agent:lts
    environment:
      AGENT_CLUSTER_ADDR: tasks.agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - agent_network
    deploy:
      mode: global
      placement:
        constraints: [node.platform.os == linux]

  portainer:
    image: portainer/portainer-ce:lts
    command: -H tcp://tasks.agent:9001 --tlsskipverify
    volumes:
      - portainer_data:/data
    networks:
      - traefik_public
      - agent_network
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.portainer.rule=Host(`portainer.teachercoop.org`)"
        - "traefik.http.routers.portainer.entrypoints=websecure"
        - "traefik.http.services.portainer.loadbalancer.server.port=9000"
        - "traefik.http.routers.portainer.service=portainer"

volumes:
  portainer_data:

networks:
  traefik_public:
    external: true
  agent_network:
    external: true

secrets:
  admin_email:
    external: true
  traefik_admin_password:
    external: true
