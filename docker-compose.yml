services:
  meilisearch:
    image: getmeili/meilisearch:v1.53.1
    environment:
      MEILI_ENV: development
    #secrets:
    #  - meili_master_key
    entrypoint:
      - sh
      - -c
      - >-
        export MEILI_MASTER_KEY="$$(cat /run/secrets/meili_master_key)";
        exec /bin/meilisearch
    volumes:
      - meilisearch_data:/meili_data

