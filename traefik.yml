api:
  insecure: false
  dashboard: true
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: "websecure"
          scheme: "https"
          permanent: true

  websecure:
    address: ":443"
    http:
      tls:
        certresolver: "cert"
providers:
  swarm:
    exposedByDefault: false
    network: traefik_public
certificatesResolvers:
  cert:
    acme:
      email: "__ADMIN_EMAIL__"
      storage: "/acme.json"
      httpChallenge:
        entryPoint: "web"
log:
  filePath: "/var/log/traefik.log"
  format: json
  level: INFO
accessLog:
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
      names:
        User-Agent: keep
        Referer: keep
    queryParameters:
      defaultMode: drop
